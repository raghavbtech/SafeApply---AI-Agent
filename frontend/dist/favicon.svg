<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Hexagon Base -->
  <rect width="64" height="64" rx="16" fill="#030712"/>
  <rect width="64" height="64" rx="16" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M32 8L50 16V30C50 42.5 42.5 51.5 32 56C21.5 51.5 14 42.5 14 30V16L32 8Z" 
        fill="url(#glowGrad)" fill-opacity="0.15" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Defense Core -->
  <path d="M32 14L45 20V30C45 39.5 39.5 46.5 32 50.5C24.5 46.5 19 39.5 19 30V20L32 14Z" 
        fill="#0B0F19" 
        stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Cyber Checkmark & Circuit Nodes -->
  <path d="M26 31.5L30.5 36L39 26.5" 
        stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tech Accent Dots -->
  <circle cx="32" cy="19" r="1.5" fill="#8B5CF6"/>
  <circle cx="32" cy="45" r="1.5" fill="#00F0FF"/>
</svg>
